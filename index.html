<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Happy Diwali 2025 🎇</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="icon" href="favicon.ico" />
</head>
<body>
  <canvas id="fireworks"></canvas>

  <!-- Name input overlay -->
  <div class="input-box" id="inputBox">
    <h2>🎆 Enter Your Name to Get Wishes 🎆</h2>
    <input type="text" id="nameInput" placeholder="Enter your name..." />
    <button onclick="showWishes()">Light Up ✨</button>
  </div>

  <!-- Greeting message -->
  <div class="greeting hidden" id="greeting">
    <h1 id="wishText"></h1>
    <p>May your life be filled with light, laughter, and prosperity!</p>
    <p class="from">– With love, <strong>Rutvik 💫</strong></p>
  </div>

  <script src="script.js"></script>
</body>
</html>
